name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant to assemble"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: "Build debug APK"
        if: github.event_name != 'workflow_dispatch' || inputs.variant == 'debug'
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: "Build release APK (unsigned)"
        if: github.event_name == 'workflow_dispatch' && inputs.variant == 'release'
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Report APK output
        if: success()
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK" ]; then
            echo "Found: $APK"
            "$SDK/build-tools/34.0.0/apksigner" verify --print-certs "$APK" \
              || echo "APK is unsigned (expected for assembleRelease)."
          fi

      - name: Upload debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.variant == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch' && inputs.variant == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
